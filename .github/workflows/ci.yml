name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.any_modified }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: tj-actions/changed-files@v47.0.0
        id: filter
        with:
          files: |
            src/**
            tests/**
            Cargo.*
            dev.mk
            Makefile
            .github/workflows/**
            templates/**
            static/**
            rust-toolchain.toml

  check:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: fmt-check
        run: make -f dev.mk fmt-check

      - name: lint
        run: make -f dev.mk lint

      - name: test
        run: make -f dev.mk test

      - name: build
        run: make -f dev.mk build-release

      - name: cache cargo-audit
        id: cache-cargo-audit
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: security audit
        run: cargo audit

  gate:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.check.result }}" = "failure" ]; then
            exit 1
          fi
